<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BookIt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{--bg:#171A18;--bg2:#202522;--card:#272E29;--acc:#A3B59F;--acc2:#899B83;--tx:#F1F0E9;--tx2:#A5AAA4;--bd:#39423B;--bad:#d9998b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 "DM Sans",Inter,system-ui,sans-serif}
h1,h2,h3,p{margin:0}h2,h3{font-weight:500}
.serif{font-family:"DM Serif Display",Georgia,serif;font-weight:400}
.hidden{display:none!important}
button,input,select{font:inherit;color:inherit}
input,select{width:100%;padding:11px 13px;background:var(--bg2);border:1px solid var(--bd);border-radius:10px;transition:border-color .2s}
input:focus,select:focus{outline:none;border-color:var(--acc)}
label{display:block;margin:14px 0 6px;color:var(--tx2);font-size:.85rem}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn{padding:10px 16px;border-radius:10px;border:1px solid var(--bd);background:var(--card);cursor:pointer;transition:.2s;min-height:42px}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);color:#171A18;border-color:var(--acc);font-weight:600}
.btn.pri:hover{background:var(--acc2);border-color:var(--acc2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:6px 12px;min-height:34px;font-size:.85rem}
.btn.dng:hover{border-color:var(--bad);color:var(--bad)}
.link{background:none;border:0;color:var(--acc);cursor:pointer;padding:8px 0}
.sub,small{color:var(--tx2)}small{display:block}
.msg{min-height:1.4em;margin-top:10px;font-size:.9rem}.err{color:var(--bad)}
/* auth */
#authView{min-height:100vh;display:grid;place-items:center;padding:20px}
#authBox{width:min(420px,100%);background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:32px}
.logo{font-size:1.9rem;margin-bottom:4px}.logo i{color:var(--acc);font-style:normal}
.pw{position:relative}.pw button{position:absolute;right:6px;top:5px;background:none;border:0;color:var(--acc);cursor:pointer;padding:8px}
#authBtn{width:100%;margin-top:18px}
/* shell */
.shell{display:flex;min-height:100vh}
.side{width:232px;flex:none;position:sticky;top:0;height:100vh;background:var(--bg2);border-right:1px solid var(--bd);padding:26px 14px;display:flex;flex-direction:column;gap:4px}
.side .logo{padding:0 12px 22px}
#nav{display:flex;flex-direction:column;gap:4px}
#nav button{text-align:left;background:none;border:0;padding:11px 12px;border-radius:10px;color:var(--tx2);cursor:pointer;transition:.2s}
#nav button:hover{background:var(--card);color:var(--tx)}
#nav button.on{background:var(--acc);color:#171A18;font-weight:600}
.me{margin-top:auto;padding:12px;border-top:1px solid var(--bd)}
.main{flex:1;min-width:0;max-width:1040px;padding:40px clamp(16px,4vw,52px) 60px}
.head{margin-bottom:26px}.head h1{font-size:clamp(1.8rem,4vw,2.5rem);line-height:1.15}.head p{margin-top:6px}
.view{animation:in .25s ease}@keyframes in{from{opacity:0;transform:translateY(6px)}}
.panel,.card,.stat{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px}
.panel{margin-bottom:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.num{font-size:2.4rem;line-height:1;color:var(--acc);margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:8px;transition:.2s}.card:hover{border-color:var(--acc);transform:translateY(-2px)}
.card .btn{margin-top:auto}.cat{color:var(--acc2)}
.ico{width:42px;height:42px;border-radius:12px;background:var(--bg2);display:grid;place-items:center;color:var(--acc)}.ico svg{width:24px;height:24px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.gap{gap:8px}.end{justify-content:flex-end;margin-top:18px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-top:1px solid var(--bd)}
.panel h2+.item,.row+.item{border-top:0}
.badge{display:inline-block;padding:2px 11px;border-radius:99px;font-size:.78rem;border:1px solid var(--bd);color:var(--tx2);white-space:nowrap}
.b-up{color:var(--acc);border-color:var(--acc)}.b-can{color:var(--bad);border-color:var(--bad)}
.empty{padding:28px 10px;text-align:center;color:var(--tx2)}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{background:none;border:1px solid var(--bd);border-radius:99px;padding:7px 16px;color:var(--tx2);cursor:pointer;transition:.2s}
.tabs button.on{background:var(--acc);color:#171A18;border-color:var(--acc);font-weight:600}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.slot{padding:10px 4px;border-radius:10px;border:1px solid var(--bd);background:var(--bg2);cursor:pointer;transition:.15s}
.slot:hover{border-color:var(--acc)}.slot.on{background:var(--acc);color:#171A18;border-color:var(--acc);font-weight:600}
#summary{margin:12px 0 18px;line-height:1.7}#summary strong{color:var(--tx)}
.scroll{overflow-x:auto}.tbl{width:100%;border-collapse:collapse;min-width:520px}
.tbl th{text-align:left;color:var(--tx2);font-weight:500;font-size:.85rem;padding:8px}
.tbl td{padding:12px 8px;border-top:1px solid var(--bd)}.act{display:flex;gap:6px;justify-content:flex-end}
.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:16px;z-index:50}
.box{width:min(460px,100%);max-height:92vh;overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:26px;animation:in .2s}
#toasts{position:fixed;top:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--card);border:1px solid var(--acc);border-radius:12px;padding:12px 16px;animation:in .2s;max-width:320px}.toast.err{border-color:var(--bad)}
@media(max-width:820px){
 .shell{display:block}
 .side{position:fixed;top:auto;bottom:0;left:0;right:0;width:auto;height:auto;flex-direction:row;padding:8px 8px calc(8px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--bd);z-index:20}
 .side .logo,.me{display:none}#nav{flex-direction:row;width:100%;justify-content:space-around}
 #nav button{text-align:center;font-size:.8rem;padding:10px 8px}
 .main{padding-bottom:100px}.two,.stats{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="authView">
  <div id="authBox">
    <div class="logo serif">Book<i>It</i></div>
    <p class="sub">Shared lab equipment, booked in a minute.</p>
    <h2 id="authTitle" class="serif" style="font-size:1.5rem;margin-top:22px">Welcome back</h2>
    <div id="nameWrap" class="hidden"><label for="name">Name</label><input id="name" autocomplete="name"></div>
    <label for="email">Email</label><input id="email" type="email" autocomplete="email">
    <label for="password">Password</label>
    <div class="pw"><input id="password" type="password" autocomplete="current-password"><button id="eye" type="button">Show</button></div>
    <button id="authBtn" class="btn pri">Log in</button>
    <div id="authMsg" class="msg err" role="alert"></div>
    <button id="toggleAuth" class="link">New here? Create an account</button>
  </div>
</div>

<div id="shell" class="shell hidden">
  <aside class="side">
    <div class="logo serif">Book<i>It</i></div>
    <nav id="nav"></nav>
    <div class="me"><strong id="meName"></strong><small id="meRole"></small><button id="logout" class="link">Log out</button></div>
  </aside>
  <main class="main">
    <div id="v-dashboard" class="view"></div>
    <div id="v-resources" class="view hidden"></div>
    <div id="v-book" class="view hidden"></div>
    <div id="v-bookings" class="view hidden"></div>
    <div id="v-admin" class="view hidden"></div>
    <div id="v-allbookings" class="view hidden"></div>
  </main>
</div>

<div id="modal" class="modal hidden"></div>
<div id="toasts" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
